# Matches GeoKnight JSON access lines for refused admin and REST calls.
# fail2ban only sees the real visitor address when Docker preserves it.
# See scripts/harden-vm.sh.

[Definition]
failregex = ^.*"remote_addr":"<HOST>".*"uri":"/geoserver/(?:web|rest|gwc/rest)/.*"status":(?:401|403)
ignoreregex =
datepattern = "time":"%%Y-%%m-%%dT%%H:%%M:%%S
