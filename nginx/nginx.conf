worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # First match wins. gwc/service is WMTS even when the query string is empty.
    map $request_uri $gs_service {
        default                                    "other";
        ~*^/geoserver/gwc/                         "WMTS";
        ~*[?&]service=wcs(&|$)                     "WCS";
        ~*[?&]service=wfs(&|$)                     "WFS";
        ~*[?&]service=wmts(&|$)                    "WMTS";
        ~*[?&]service=wms(&|$)                     "WMS";
        ~*^/geoserver/[^/]+/wcs                    "WCS";
        ~*^/geoserver/[^/]+/wfs                    "WFS";
        ~*^/geoserver/[^/]+/wms                    "WMS";
        ~*^/geoserver/web                          "ADMIN";
        ~*^/geoserver/rest/                        "REST";
        ~*^/geoserver/gwc/rest/                    "GWCADMIN";
        ~*^/grafana/                               "GRAFANA";
    }

    map $request_uri $gs_layer {
        default                                                              "-";
        ~*^/geoserver/gwc/service/wmts/rest/([^/?]+)                         $1;
        ~*(?:^|[?&])(?:layers|typenames|typename|layer)=([^&]+)              $1;
    }

    map $upstream_http_geowebcache_cache_result $gs_cache {
        default $upstream_http_geowebcache_cache_result;
        ""      "-";
    }

    log_format geoknight escape=json
        '{'
          '"time":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$request_uri",'
          '"status":$status,'
          '"bytes":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"upstream_time":"$upstream_response_time",'
          '"service":"$gs_service",'
          '"layer":"$gs_layer",'
          '"cache":"$gs_cache",'
          '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log geoknight buffer=8k flush=1s;

    include /etc/nginx/conf.d/*.conf;
}
