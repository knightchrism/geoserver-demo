worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # First match wins. gwc/service is WMTS even when the query string is empty.
    map $request_uri $gs_service {
        default                                    "other";
        ~*^/geoserver/gwc/                         "WMTS";
        ~*[?&]service=wcs(&|$)                     "WCS";
        ~*[?&]service=wfs(&|$)                     "WFS";
        ~*[?&]service=wmts(&|$)                    "WMTS";
        ~*[?&]service=wms(&|$)                     "WMS";
        ~*^/geoserver/[^/]+/wcs                    "WCS";
        ~*^/geoserver/[^/]+/wfs                    "WFS";
        ~*^/geoserver/[^/]+/wms                    "WMS";
        ~*^/geoserver/web                          "ADMIN";
        ~*^/geoserver/rest/                        "REST";
        ~*^/geoserver/gwc/rest/                    "GWCADMIN";
        ~*^/grafana/                               "GRAFANA";
    }

    # $arg_* is already URL-decoded, so public:roads and public%3Aroads become one name.
    # Query-string names win. The WMTS REST path is only used when no layer argument was sent.
    map $arg_layers $gs_arg_layers {
        default $arg_layers;
        ""      $arg_LAYERS;
    }
    map $gs_arg_layers $gs_arg_layer {
        default $gs_arg_layers;
        ""      $arg_layer;
    }
    map $gs_arg_layer $gs_arg_layer2 {
        default $gs_arg_layer;
        ""      $arg_LAYER;
    }
    map $gs_arg_layer2 $gs_arg_types {
        default $gs_arg_layer2;
        ""      $arg_typenames;
    }
    map $gs_arg_types $gs_arg_types2 {
        default $gs_arg_types;
        ""      $arg_TYPENAMES;
    }
    map $gs_arg_types2 $gs_arg_type {
        default $gs_arg_types2;
        ""      $arg_typename;
    }
    map $gs_arg_type $gs_arg_type2 {
        default $gs_arg_type;
        ""      $arg_TYPENAME;
    }
    map $request_uri $gs_layer_path {
        default "-";
        ~*^/geoserver/gwc/service/wmts/rest/([^/?]+) $1;
    }
    map $gs_arg_type2 $gs_layer_raw {
        default $gs_arg_type2;
        ""      $gs_layer_path;
    }
    # $arg_* stays percent-encoded in this Nginx, so decode the sequences used in layer names.
    map $gs_layer_raw $gs_layer_d1 {
        default $gs_layer_raw;
        ~*^(.*)%3[Aa](.*)$ $1:$2;
    }
    map $gs_layer_d1 $gs_layer_d2 {
        default $gs_layer_d1;
        ~*^(.*)%3[Aa](.*)$ $1:$2;
    }
    map $gs_layer_d2 $gs_layer_d3 {
        default $gs_layer_d2;
        ~*^(.*)%2[Cc](.*)$ $1,$2;
    }
    map $gs_layer_d3 $gs_layer {
        default $gs_layer_d3;
        ~*^(.*)%2[Cc](.*)$ $1,$2;
    }

    map $upstream_http_geowebcache_cache_result $gs_cache {
        default $upstream_http_geowebcache_cache_result;
        ""      "-";
    }

    log_format geoknight escape=json
        '{'
          '"time":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$request_uri",'
          '"status":$status,'
          '"bytes":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"upstream_time":"$upstream_response_time",'
          '"service":"$gs_service",'
          '"layer":"$gs_layer",'
          '"cache":"$gs_cache",'
          '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log geoknight buffer=8k flush=1s;

    include /etc/nginx/conf.d/*.conf;
}
